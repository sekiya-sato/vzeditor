[package]
name = "vzeditor"
version = "0.1.0"
edition = "2021"
description = "VZ Editor - fast native GUI VZ-style text editor (based on LZ Editor, MIT)"
license = "MIT"
keywords = ["editor", "vz-editor", "egui", "filer"]
categories = ["text-editors", "gui"]

[[bin]]
name = "vz"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
unicode-width = "0.2"

# build.rs でビルド日時（About の Build At）を埋め込む
[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Windows: ネイティブのファイルダイアログとクリップボード、
# Claude Code / Codex への送信（ウィンドウ検索・前面化・キー入力）
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: クリップボード（ファイルダイアログは osascript）
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
