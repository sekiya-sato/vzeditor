[workspace]
members = ["crates/*"]
# ルートで cargo check / clippy / test / build すると全クレートが対象になる
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sekiya-sato/vzeditor"

[workspace.dependencies]
vz-core = { path = "crates/vz-core" }
vz-config = { path = "crates/vz-config" }
vz-platform = { path = "crates/vz-platform" }
vz-ui = { path = "crates/vz-ui" }
vz-terminal = { path = "crates/vz-terminal" }
vz-browser = { path = "crates/vz-browser" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
unicode-width = "0.2"

# 実行ファイル vz（起動・引数処理・アイコン・配布設定）。構成は docs/基本設計.md の「クレート構成」
[package]
name = "vzeditor"
version.workspace = true
edition.workspace = true
description = "VZ Editor - fast native GUI VZ-style text editor (based on LZ Editor, MIT)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["editor", "vz-editor", "egui", "filer"]
categories = ["text-editors", "gui"]

[[bin]]
name = "vz"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
vz-config.workspace = true
vz-ui.workspace = true

# build.rs で Windows の exe にアイコン（assets/vzeditor.ico）を埋め込む
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Linux 向け .deb / .rpm（.github/workflows/release.yml で cargo-deb / cargo-generate-rpm が使う）
[package.metadata.deb]
maintainer = "Sekiya Sato"
copyright = "2026, Touryu Tamane; 2026, Sekiya Sato"
license-file = ["LICENSE", "0"]
extended-description = """\
VZ Editor is a fast native GUI text editor and 2-pane filer written in Rust (eframe/egui), \
based on LZ Editor. It adds background/text transparency, always-on-top, \
Sakura Editor compatible key bindings (switchable to VZ style), multi-file drag & drop, \
and sending text to Claude Code / Codex."""
depends = "$auto"
recommends = "fonts-noto-cjk | fonts-ipafont-gothic | fonts-vlgothic, zenity, xdotool, xclip"
section = "editors"
priority = "optional"
assets = [
    ["target/release/vz", "usr/bin/vz", "755"],
    ["assets/vzeditor.desktop", "usr/share/applications/vzeditor.desktop", "644"],
    ["assets/vzeditor.svg", "usr/share/icons/hicolor/scalable/apps/vzeditor.svg", "644"],
    ["README.md", "usr/share/doc/vzeditor/README.md", "644"],
]

[package.metadata.generate-rpm]
auto-req = "builtin"
assets = [
    { source = "target/release/vz", dest = "/usr/bin/vz", mode = "0755" },
    { source = "assets/vzeditor.desktop", dest = "/usr/share/applications/vzeditor.desktop", mode = "0644" },
    { source = "assets/vzeditor.svg", dest = "/usr/share/icons/hicolor/scalable/apps/vzeditor.svg", mode = "0644" },
    { source = "README.md", dest = "/usr/share/doc/vzeditor/README.md", mode = "0644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/vzeditor/LICENSE", mode = "0644", doc = true },
]
