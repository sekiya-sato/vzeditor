[package]
name = "vzeditor"
version = "0.1.0"
edition = "2021"
description = "VZ Editor - fast native GUI VZ-style text editor (based on LZ Editor, MIT)"
license = "MIT"
keywords = ["editor", "vz-editor", "egui", "filer"]
categories = ["text-editors", "gui"]

[[bin]]
name = "vz"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
unicode-width = "0.2"

# Windows: ネイティブのファイルダイアログとクリップボード
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }

# macOS: クリップボード（ファイルダイアログは osascript）
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
