[package]
name = "vz-platform"
description = "VZ Editor: OS 固有処理（ファイルダイアログ・クリップボード・外部アプリへの送信・印刷）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 印刷の割付（vz_core::print::PrintDoc）を受け取って紙へ出す
vz-core.workspace = true
# 仮想デスクトップの対象ウィンドウ（eframe の生ハンドル）を受け取る
raw-window-handle = "0.6"

# Windows: ネイティブのファイルダイアログとクリップボード、関連付けでの実行（ShellExecute）、
# Claude Code / Codex への送信（ウィンドウ検索・前面化・キー入力）
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 仮想デスクトップ（IVirtualDesktopManager）。webview2-com と同じ版
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# macOS: クリップボード（ファイルダイアログは osascript）
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
core-foundation = "0.9"
core-graphics = "0.23"

# Linux X11: 仮想デスクトップ（EWMH の _NET_WM_DESKTOP）。winit と同じ版
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# 印刷: PDF を作って lp（CUPS）へ渡す。日本語フォントは使った文字だけ埋め込む
[target.'cfg(not(windows))'.dependencies]
krilla = { version = "0.8.2", default-features = false }
skrifa = "0.42"

# Windows でも PDF 生成（macOS / Linux 用）をテストで確かめる
[target.'cfg(windows)'.dev-dependencies]
krilla = { version = "0.8.2", default-features = false }
skrifa = "0.42"
