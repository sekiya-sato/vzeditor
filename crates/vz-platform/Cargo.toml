[package]
name = "vz-platform"
description = "VZ Editor: OS 固有処理（ファイルダイアログ・クリップボード・外部アプリへの送信）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 仮想デスクトップの対象ウィンドウ（eframe の生ハンドル）を受け取る
raw-window-handle = "0.6"

# Windows: ネイティブのファイルダイアログとクリップボード、関連付けでの実行（ShellExecute）、
# Claude Code / Codex への送信（ウィンドウ検索・前面化・キー入力）
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 仮想デスクトップ（IVirtualDesktopManager）。webview2-com と同じ版
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# macOS: クリップボード（ファイルダイアログは osascript）
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }

# Linux X11: 仮想デスクトップ（EWMH の _NET_WM_DESKTOP）。winit と同じ版
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
