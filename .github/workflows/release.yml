name: Release

# v で始まるタグ（例: v0.1.0）を push すると、各 OS 向けにテスト・ビルドして GitHub Release に公開する。
# 手動実行（workflow_dispatch）ではビルドと成果物のアップロードまで行い、Release は作らない。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: linux
            arch: x86_64
            bin: vz
            asset_name: vz-linux-x86_64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            bin: vz
            asset_name: vz-linux-aarch64
          - runner: windows-latest
            os_name: windows
            arch: x86_64
            bin: vz.exe
            asset_name: vz-windows-x86_64.exe
          - runner: macos-latest
            os_name: macos
            arch: aarch64
            bin: vz
            asset_name: vz-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools (cargo-deb & cargo-generate-rpm)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-deb and cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo binstall --no-confirm cargo-deb cargo-generate-rpm

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Build .deb and .rpm packages
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --no-strip -o dist/
          cargo generate-rpm -o dist/

      - name: Write SHA256 checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          $SUM * > "../${{ matrix.os_name }}-${{ matrix.arch }}.sha256"
          mv "../${{ matrix.os_name }}-${{ matrix.arch }}.sha256" .
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vz-*
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
